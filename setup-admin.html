<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء مدير النظام</title><style id="st"></style></head><body><header><h1>إنشاء مدير النظام (مرة واحدة فقط)</h1></header><main><div class="card">
<label>الاسم الكامل</label><input id="nm"><label>الرقم القومي</label><input id="n" inputmode="numeric" maxlength="14"><label>الإيميل الجامعي</label><input id="em" type="email"><label>رقم الموبايل</label><input id="ph"><label>كلمة المرور</label><input id="p" type="password"><button id="go">إنشاء المدير</button><div id="m"></div></div></main><div class="ft">Created by Abdelrhman Sayed</div>
<script type="module">
import{auth,db,A,F,css,email,validNid}from"./firebase.js";document.getElementById("st").textContent=css;
const m=(c,t)=>document.getElementById("m").innerHTML=`<div class="msg ${c}">${t}</div>`,v=i=>document.getElementById(i).value.trim();
document.getElementById("go").onclick=async()=>{if(!v("nm")||!validNid(v("n"))||!/@/.test(v("em"))||!v("ph")||v("p").length<8)return m("err","أكمل كل الحقول (كلمة المرور 8 أحرف فأكثر)");
try{let c;try{c=await A.createUserWithEmailAndPassword(auth,email(v("n")),v("p"))}catch(x){if(x.code!=="auth/email-already-in-use")throw x;c=await A.signInWithEmailAndPassword(auth,email(v("n")),v("p"))}const b=F.writeBatch(db);b.set(F.doc(db,"settings","adminLock"),{uid:c.user.uid});b.set(F.doc(db,"admins",c.user.uid),{name:v("nm"),nid:v("n"),universityEmail:v("em"),phone:v("ph"),role:"owner"});b.set(F.doc(db,"config","settings"),{allowPrint:true});await b.commit();m("ok","تم إنشاء المدير. احذف هذا الملف من الاستضافة الآن، ثم ادخل من admin.html")}catch(e){m("err","فشل الإنشاء: "+e.code+(e.code=="permission-denied"?" — تأكد من إنشاء Firestore ونشر القواعد (Publish) ثم أعد المحاولة":e.code=="auth/wrong-password"||e.code=="auth/invalid-credential"?" — الحساب موجود بكلمة مرور مختلفة، استخدم نفس كلمة المرور الأولى":""))}}</script></body></html>
