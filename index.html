<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام تسجيل رغبات الطلاب – كلية الزراعة جامعة الفيوم</title><style id="st"></style></head><body>
<header><h1>نظام تسجيل الرغبات – كلية الزراعة، جامعة الفيوم</h1><small>الفرقة الثانية – العام الجامعي 2026/2027</small></header>
<main id="app"></main>
<div id="sheet" class="hide"></div>
<style>@media print{body>header,main{display:none!important}#sheet{display:block!important}@page{size:A4;margin:10mm}}#sheet{background:#fff;color:#000;padding:8px;font-size:12.5px;line-height:1.8}#sheet *{color:#000}#sheet table{border-collapse:collapse;width:100%;margin:6px 0}#sheet th,#sheet td{border:1px solid #000;padding:3px 6px;background:#fff;text-align:right;font-size:11.5px}#sheet h2,#sheet h3{text-align:center;margin:4px 0}.pb{page-break-before:always}.logos{display:flex;justify-content:space-between;align-items:center}.logos img{height:64px}.dots{border-bottom:1px dotted #000;display:inline-block;min-width:150px;padding:0 6px}</style>
<script type="module">
import{auth,db,A,F,css,email,validNid,mask,esc,fa,loadCatalog}from"./firebase.js";
document.getElementById("st").textContent=css;
const app=document.getElementById("app");let CAT,STU=[],me=null,uref=null,settings={allowPrint:true},reg=false;
const $=s=>document.querySelector(s),show=(h)=>app.innerHTML=h,note=(c,t)=>`<div class="msg ${c}">${esc(t)}</div>`;
const rosterP=F.getDoc(F.doc(db,"public","roster")).then(r=>{if(r.exists())STU=JSON.parse(r.data().json)}).catch(()=>{});
const login=(m="")=>show(`<div class="card"><h3>تسجيل الدخول</h3>${m}<label>الرقم القومي</label><input id="n" inputmode="numeric" maxlength="14"><label>كلمة المرور</label><input id="p" type="password"><label style="display:flex;gap:8px;align-items:center"><input id="r" type="checkbox" style="width:auto">تذكرني</label><button id="go">دخول</button><button class="alt" id="reg">إنشاء حساب جديد</button><p style="font-size:.8rem">نسيت كلمة المرور؟ تواصل مع إدارة الكلية لإعادة تعيينها بعد التحقق من هويتك.</p></div>`),
bind=()=>{$("#reg").onclick=register;$("#go").onclick=async()=>{const n=$("#n").value.trim();if(!validNid(n)){login(note("err","الرقم القومي يجب أن يكون 14 رقمًا"));return bind()}try{await A.setPersistence(auth,$("#r").checked?A.browserLocalPersistence:A.browserSessionPersistence);await A.signInWithEmailAndPassword(auth,email(n),$("#p").value)}catch(e){login(note("err",e.code=="auth/too-many-requests"?"محاولات كثيرة، حاول لاحقًا":"بيانات الدخول غير صحيحة"));bind()}}};
function register(){let sel=null;show(`<div class="card"><h3>إنشاء حساب</h3><label>اكتب اسمك الرباعي وابحث</label><input id="q" autocomplete="off"><div id="ls" class="list hide"></div><div id="f" class="hide"><div class="msg ok" id="info"></div><label>الرقم القومي</label><input id="n" inputmode="numeric" maxlength="14"><label>رقم الهاتف</label><input id="ph" inputmode="tel" maxlength="11"><label>الفرقة الدراسية</label><input value="الثانية" disabled><label>كلمة المرور (6 أحرف على الأقل)</label><input id="p" type="password"><label>تأكيد كلمة المرور</label><input id="p2" type="password"><button id="mk">إنشاء الحساب</button></div><div id="m"></div><button class="alt" id="bk">رجوع</button></div>`);
$("#bk").onclick=()=>{login();bind()};$("#q").oninput=e=>{const k=fa(e.target.value),l=$("#ls");if(k.length<3){l.classList.add("hide");return}const r=STU.filter(s=>fa(s.name).includes(k)).slice(0,30);l.innerHTML=r.map(s=>`<div data-i="${s.id}">${esc(s.name)}</div>`).join("")||`<div>${STU.length?"لا توجد نتائج":"لم يتم رفع كشف الطلاب بعد، تواصل مع الإدارة"}</div>`;l.classList.remove("hide")};
$("#ls").onclick=e=>{const i=e.target.dataset.i;if(!i)return;sel=STU.find(s=>s.id==i);$("#ls").classList.add("hide");$("#q").value=sel.name;$("#f").classList.remove("hide");$("#info").innerHTML=`الاسم: ${esc(sel.name)}<br>الكود التسلسلي: ${sel.id}`};
$("#mk").onclick=async()=>{const n=$("#n").value.trim(),ph=$("#ph").value.trim(),p=$("#p").value,m=$("#m");const E=t=>m.innerHTML=note("err",t);if(!sel)return E("اختر اسمك من القائمة");if(!validNid(n))return E("الرقم القومي 14 رقمًا");if(!/^01\d{9}$/.test(ph))return E("رقم الهاتف غير صحيح");if(p.length<6||p!==$("#p2").value)return E("كلمة المرور قصيرة أو غير متطابقة");$("#mk").disabled=true;let cu;reg=true;
try{cu=await A.createUserWithEmailAndPassword(auth,email(n),p)}catch(e){reg=false;$("#mk").disabled=false;return E(e.code=="auth/email-already-in-use"?"هذا الرقم القومي مسجل بالفعل":"تعذر إنشاء الحساب")}
try{const b=F.writeBatch(db);b.set(F.doc(db,"claims",String(sel.id)),{uid:cu.user.uid});b.set(F.doc(db,"users",cu.user.uid),{serial:sel.id,name:sel.name,nid:n,phone:ph,advisor:sel.advisor,level:"الثانية",choices:[{},{},{}],status:"draft",locked:false,canPrint:true,active:true,reopenCount:0,createdAt:F.serverTimestamp()});await b.commit();reg=false;await enter(auth.currentUser)}catch(e){await cu.user.delete().catch(()=>{});setTimeout(()=>reg=false,800);$("#mk").disabled=false;E("هذا الاسم مسجل بحساب آخر بالفعل. راجع الإدارة.")}}}
A.onAuthStateChanged(auth,u=>{if(!reg)enter(u)});async function enter(u){if(!u){me=null;login();return bind()}uref=F.doc(db,"users",u.uid);const s=await F.getDoc(uref);if(!s.exists()){show(note("warn","هذا الحساب غير مرتبط ببيانات طالب. إن كنت مسؤولًا فادخل من صفحة الإدارة.")+'<button id="lo">خروج</button>');$("#lo").onclick=()=>A.signOut(auth);return}me=s.data();await rosterP;{const r0=STU.find(x=>x.id==me.serial);me.advisor=r0?r0.advisor:(me.advisor||"غير موجود")}CAT=await loadCatalog();try{settings=(await F.getDoc(F.doc(db,"config","settings"))).data()||settings}catch(e){}form()}
const prog=id=>CAT.programs.find(p=>p.id==id),stat=()=>me.status=="printed"?"تم الاعتماد والطباعة":me.choices.some(c=>c.program)?"تم الحفظ – لم تُطبع بعد":"لم تبدأ التسجيل";
function card(i){const c=me.choices[i]||{},L=["الأولى","الثانية","الثالثة"][i],P=prog(c.program),dis=me.locked?"disabled":"";
const opts=CAT.programs.filter(p=>p.active).map(p=>`<option value="${p.id}" ${c.program==p.id?"selected":""}>${esc(p.name)}</option>`).join("");
const cs=P?P.courses.map(x=>`<option ${""}>${esc(x)}</option>`).join(""):"",ev=P?CAT.electives.filter(e=>!e.blocked.includes(P.id)).map(e=>e.name):[];
const o=(arr,v)=>`<option value="">— اختر —</option>`+arr.map(x=>`<option ${x==v?"selected":""}>${esc(x)}</option>`).join("");
return`<div class="card w${i+1}" data-i="${i}"><h3>الرغبة ${L}</h3><label>البرنامج</label><select class="pg" ${dis}><option value="">— اختر البرنامج —</option>${opts}</select>${P?`<div class="msg warn">تنبيه: للالتحاق بهذا البرنامج يجب ${esc(P.req)}. تراجع شئون الطلاب الدرجات.</div><label>مقرر 1 داخل التخصص</label><select class="c1" ${dis}>${o(P.courses,c.c1)}</select><label>مقرر 2 داخل التخصص</label><select class="c2" ${dis}>${o(P.courses,c.c2)}</select><label>مقرر 3 خارج التخصص</label><select class="c3" ${dis}>${o(ev,c.c3)}</select>`:""}</div>`}
function read(){document.querySelectorAll("[data-i]").forEach(d=>{const i=+d.dataset.i,g=s=>d.querySelector(s)?.value||"";me.choices[i]={program:g(".pg"),c1:g(".c1"),c2:g(".c2"),c3:g(".c3")}})}
function check(full){const e=[],used=new Set();me.choices.forEach((c,i)=>{const n=i+1,P=prog(c.program);if(!P){full&&e.push(`الرغبة ${n}: اختر البرنامج`);return}if(!P.active)e.push(`الرغبة ${n}: البرنامج موقوف`);if(used.has(c.program))e.push(`الرغبة ${n}: البرنامج مكرر`);used.add(c.program);if(c.c1&&c.c1==c.c2)e.push(`الرغبة ${n}: لا يمكن تكرار المقرر`);[c.c1,c.c2].forEach(x=>x&&!P.courses.includes(x)&&e.push(`الرغبة ${n}: مقرر غير مؤهل`));if(c.c3&&!CAT.electives.some(x=>x.name==c.c3&&!x.blocked.includes(P.id)))e.push(`الرغبة ${n}: مقرر اختياري غير مسموح`);if(full&&(!c.c1||!c.c2||!c.c3))e.push(`الرغبة ${n}: أكمل المقررات الثلاثة`)});return e}
function form(m=""){const can=settings.allowPrint&&me.canPrint!==false&&me.active!==false;show(`<div class="card"><h3>${esc(me.name)}</h3><div class="row"><div>الكود التسلسلي: <b>${me.serial}</b></div><div>الفرقة: ${me.level}</div><div>الرقم القومي: ${esc(me.nid)}</div><div>الهاتف: ${esc(me.phone)}</div></div><div>حالة الاستمارة: <span class="badge">${stat()}</span></div>${me.locked?note("warn","الاستمارة مقفلة بعد الاعتماد. للتعديل تواصل مع الإدارة."):""}${me.active===false?note("err","حسابك موقوف، راجع الإدارة"):""}</div>${m}<h2 style="text-align:center">البرنامج الذي ترغب في التوجه إليه</h2>${[0,1,2].map(card).join("")}<div class="card"><label>تعديل رقم الهاتف</label><input id="ph" value="${esc(me.phone)}" ${me.locked?"disabled":""}><button id="sv" ${me.locked?"disabled":""}>حفظ</button><button id="pr" ${me.locked||!can?"disabled":""}>اعتماد وطباعة الاستمارة</button>${!settings.allowPrint?note("warn","الطباعة مغلقة حاليًا من الإدارة"):""}${me.locked?'<button class="alt" id="rp">عرض / إعادة طباعة الاستمارة</button>':""}<button class="alt" id="lo">تسجيل الخروج</button></div>`);
app.onchange=e=>{if(me.locked)return;read();if($("#ph"))me.phone=$("#ph").value;if(e.target.classList.contains("pg")){const i=+e.target.closest("[data-i]").dataset.i;me.choices[i]={program:e.target.value,c1:"",c2:"",c3:""}}form()};
$("#lo").onclick=()=>A.signOut(auth);if($("#rp"))$("#rp").onclick=print;
const save=async(lock)=>{read();if(!/^01\d{9}$/.test($("#ph").value))return form(note("err","رقم الهاتف غير صحيح"));me.phone=$("#ph").value;const er=check(lock);if(er.length)return form(note("err",er.join(" • ")));const d={phone:me.phone,choices:me.choices};if(lock){Object.assign(d,{status:"printed",locked:true,printedAt:F.serverTimestamp()})}try{await F.updateDoc(uref,d);if(lock){me.status="printed";me.locked=true;me.printedAt=new Date();form(note("ok","تم الاعتماد"));print()}else form(note("ok","تم الحفظ. يمكنك العودة لاحقًا للتعديل."))}catch(e){form(note("err","تعذر الحفظ: الصلاحية غير متاحة حاليًا"))}};
$("#sv").onclick=()=>save(false);$("#pr").onclick=()=>{read();const er=check(true);if(er.length)return form(note("err",er.join(" • ")));if(confirm("تأكيد نهائي: بعد الاعتماد سيتم قفل بياناتك ورغباتك ولن تستطيع تعديلها. هل أنت متأكد؟"))save(true)}}
function print(){const strip=t=>t.replace(/^اجتياز:\s*/,""),L=["الأولى","الثانية","الثالثة"],nm=id=>CAT.programs.find(p=>p.id==id)?.name||id;
const q=CAT.programs.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${esc(strip(p.req))}</td></tr>`).join("");
const w=me.choices.map((c,i)=>`<div style="margin:6px 0"><b>الرغبة ${L[i]}:</b> برنامج <span class="dots">${esc(prog(c.program)?.name||"")}</span><br>1- مقرر 1 داخل تخصص <span class="dots">${esc(c.c1)}</span> &nbsp; 2- مقرر 2 داخل تخصص <span class="dots">${esc(c.c2)}</span><br>3- مقرر 3 خارج تخصص <span class="dots">${esc(c.c3)}</span></div>`).join("");
const pt=CAT.programs.map(p=>`<table><tr><th>برنامج ${esc(p.name)}</th></tr>${p.courses.map(c=>`<tr><td>${esc(c)}</td></tr>`).join("")}</table>`).join("");
const el=CAT.electives.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(e.name)}</td><td>${e.blocked.length?e.blocked.map(nm).map(esc).join("، "):"--"}</td></tr>`).join("");
const d=me.printedAt?.toDate?me.printedAt.toDate():new Date(me.printedAt||Date.now());
const adv=me.advisor&&me.advisor!="غير موجود"?"دكتور/ "+esc(me.advisor):"غير موجود";
$("#sheet").innerHTML=`<div class="logos"><img src="img/fayoum.png" onerror="this.style.visibility='hidden'"><div style="text-align:center"><b>جامعة الفيوم – كلية الزراعة</b></div><img src="img/agri.png" onerror="this.style.visibility='hidden'"><img src="img/quality.png" onerror="this.style.visibility='hidden'"></div><h2>استمارة تحديد رغبات</h2><h3>لطلاب المستوى الثاني (2026/2027)</h3><p style="text-align:left;margin:0">كود الطالب: <b>${me.serial}</b></p>
<p>اسم الطالب: <span class="dots" style="min-width:300px">${esc(me.name)}</span><br>الرقم القومي: <span class="dots">${esc(me.nid)}</span> &nbsp; رقم الهاتف: <span class="dots">${esc(me.phone)}</span></p>${w}
<p><b>على أن يراعى عند اختيار البرنامج اجتياز المقررات التالية بنجاح:</b></p><table><tr><th>م</th><th>البرنامج</th><th>المقررات الدراسية المؤهلة للالتحاق</th></tr>${q}</table>
<p style="font-size:11.5px;margin:2px 0">• أولوية الالتحاق تكون للطالب الذي لم يسبق له الرسوب في إحدى المواد المؤهلة للالتحاق بالبرنامج.<br>• بيانات درجات المقررات المؤهلة للبرامج تراجع بمعرفة شئون الطلاب.<br>• في حالة استنفاذ الطالب لجميع الرغبات يتم تشعيبه إلى أحد البرامج الأخرى.</p>
<p><b>آخر موعد لاستلام الاستمارة يوم: الثلاثاء الموافق 15 / 12 / 2026</b></p>
<table style="border:0"><tr><td style="border:0;width:50%"><b>الطالب</b><br>اسم الطالب: ${esc(me.name)}<br>توقيع: ..................</td><td style="border:0"><b>المرشد الأكاديمي</b><br>${adv}<br>توقيع: ..................</td></tr></table><small>تاريخ ووقت الاعتماد: ${d.toLocaleString("ar-EG")}</small>
<div class="pb"></div><h3>المقررات داخل كل برنامج</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${pt}</div><h3>المقررات خارج التخصص</h3><table><tr><th>م</th><th>المقرر</th><th>البرامج التي لا يسمح لهم بدراستها</th></tr>${el}</table>`;setTimeout(()=>window.print(),400)}
</script></body></html>
